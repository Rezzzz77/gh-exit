name: ts-exit

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'نام نود (مثلاً exit-ali)'
        required: true
      authkey:
        description: 'Auth Key اختصاصی کاربر'
        required: true

concurrency:
  group: exit-${{ inputs.hostname }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Setup TUN
        run: |
          sudo modprobe tun 2>/dev/null || true
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Exit Node
        run: |
          sudo mkdir -p /var/run/tailscale /var/lib/tailscale
          
          sudo setsid nohup tailscaled \
            --state=/var/lib/tailscale/ts.state \
            --statedir=/var/lib/tailscale \
            --socket=/var/run/tailscale/tailscaled.sock \
            > /tmp/tscaled.log 2>&1 &
          
          sleep 5
          
          sudo tailscale --socket=/var/run/tailscale/tailscaled.sock up \
            --authkey="${{ inputs.authkey }}" \
            --hostname="${{ inputs.hostname }}" \
            --advertise-exit-node \
            --accept-dns=false \
            --accept-risk=lose-ssh
          
          echo "=== Status ==="
          sudo tailscale --socket=/var/run/tailscale/tailscaled.sock status

      - name: Report IP
        run: |
          PUB_IP=$(curl -s --max-time 10 https://api.ipify.org)
          echo "🖥  Public IP: $PUB_IP"
          echo "$PUB_IP" > ts_public_ip.txt
          git config user.name "ts-bot"
          git config user.email "ts-bot@users.noreply.github.com"
          git add ts_public_ip.txt
          git commit -m "exit: ${{ inputs.hostname }} $PUB_IP" || true
          git push || true

      - name: Keep Alive (5.5 hours)
        run: |
          TS="sudo tailscale --socket=/var/run/tailscale/tailscaled.sock"
          END=$((SECONDS + 19800))
          FAILS=0
          while [ $SECONDS -lt $END ]; do
            sleep 60
            if ! $TS status >/dev/null 2>&1; then
              FAILS=$((FAILS+1))
              sudo tailscaled --state=/var/lib/tailscale/ts.state \
                --socket=/var/run/tailscale/tailscaled.sock &
              sleep 5
              $TS up --authkey="${{ inputs.authkey }}" \
                --hostname="${{ inputs.hostname }}" \
                --advertise-exit-node --accept-dns=false
            else
              FAILS=0
            fi
            echo "[$(date -u +%T)] alive"
            [ "$FAILS" -ge 10 ] && exit 1
          done

      - name: Auto Chain
        if: always()
        run: |
          echo "🔄 Dispatching next..."
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ts-exit.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"hostname\": \"${{ inputs.hostname }}\",
                \"authkey\": \"${{ inputs.authkey }}\"
              }
            }" || echo "Dispatch failed"
