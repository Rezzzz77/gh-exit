name: ts-watchdog-clean
# نگهبان ایمن برای ts-exit-clean
# هر ۱۵ دقیقه چک می‌کند:
#  1. اگر رانی در حال اجرا <۳۴۰ دقیقه → سالم، کاری نکن
#  2. اگر رانی >۳۴۰ دقیقه (زامبی) → لغو + دیسپچ تازه
#  3. اگر هیچ رانی نیست → اگر شکست تازه (<۱۵د) صبر کن، وگرنه دیسپچ تازه

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ts-watchdog-clean
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Python helpers
        shell: bash
        run: |
          cat > /tmp/ts_age.py <<'PYA'
          import json,sys,datetime
          rs = json.load(sys.stdin).get("workflow_runs", [])
          if not rs:
              print(0)
          else:
              t = max(datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) for r in rs)
              print(int((datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() // 60))
          PYA
          cat > /tmp/ts_guard.py <<'PYG'
          import json,sys,datetime
          rs = json.load(sys.stdin).get("workflow_runs", [])
          if not rs:
              raise SystemExit(0)
          r = rs[0]
          age = int((datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00"))).total_seconds())
          print("last completed run: %s — %d min ago" % (r.get("conclusion"), age // 60))
          if r.get("conclusion") == "failure" and age < 900:
              print("fresh failure - skip this cycle (loop guard).")
              raise SystemExit(2)
          PYG

      - name: Check & Dispatch if needed
        shell: bash
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TOK="${PAT:-${{ github.token }}}"
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO/actions/workflows/ts-exit-clean.yml/runs"
          AUTH=(-H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json")
          
          count_runs() {
            local status=$1
            curl -s --max-time 15 "${AUTH[@]}" "$API?status=$status&per_page=10" \
              | tr -d ' ' | grep -o '"total_count":[0-9]*' | head -1 | cut -d: -f2
          }
          
          RUNNING=$(count_runs in_progress);  RUNNING=${RUNNING:-0}
          QUEUED=$(count_runs queued);      QUEUED=${QUEUED:-0}
          
          echo "in_progress=$RUNNING queued=$QUEUED"
          
          # اگر در صف هست، صبر کن
          if [ "$QUEUED" -gt 0 ]; then
            echo "job queued - waiting"
            exit 0
          fi
          
          # اگر در حال اجرا هست، سن چک کن
          if [ "$RUNNING" -gt 0 ]; then
            curl -s --max-time 15 "${AUTH[@]}" "$API?status=in_progress&per_page=5" > /tmp/tsr.json
            OLDEST=$(python3 /tmp/ts_age.py < /tmp/tsr.json)
            OLDEST=${OLDEST:-0}
            echo "oldest running: ${OLDEST}min"
            if [ "$OLDEST" -le 340 ]; then
              echo "node alive - nothing to do"
              exit 0
            fi
            echo "zombie run (>340 min) - cancelling..."
            IDS=$(grep -o '"id":[0-9]*' /tmp/tsr.json | cut -d: -f2)
            for id in $IDS; do
              curl -s -o /dev/null -X POST "${AUTH[@]}" \
                "https://api.github.com/repos/$REPO/actions/runs/$id/cancel"
              echo "  cancelled $id"
            done
            sleep 20
          fi
          
          # loop guard: شکست تازه (<15د) = صبر کن
          curl -s --max-time 15 "${AUTH[@]}" "$API?status=completed&per_page=1" > /tmp/tsc.json
          python3 /tmp/ts_guard.py < /tmp/tsc.json || exit 0
          
          # دیسپچ نود تازه با hostname ثابت
          echo "🚀 Dispatching fresh node..."
          C=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"hostname":"gh-exit"}}' \
            "https://api.github.com/repos/$REPO/actions/workflows/ts-exit-clean.yml/dispatches")
          echo "dispatched: HTTP $C"
          [ "$C" = "204" ] || exit 1