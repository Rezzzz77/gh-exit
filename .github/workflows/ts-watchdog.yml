name: ts-watchdog
# نگهبان زمان‌بندی‌شدهٔ نود Tailscale (exit node روی رانر Actions)
#
# چرا لازم است: ورک‌فلوی ts-exit فقط با دست (workflow_dispatch) صدا زده می‌شود و
# سقف هر جاب ۳۵۰ دقیقه است. اگر جاب تمام/لغو/خراب شود، هیچ‌کس دوباره صدایش
# نمی‌زند و نود از تیل‌نت حذف می‌شود (کلید ephemeral است).
#
# این نگهبان هر ۱۵ دقیقه نگاه می‌کند:
#   ۱) اگر ران ts-exit در جریان است و جوان‌تر از ۴۰۰ دقیقه → همه‌چیز سالم، کاری نکن
#   ۲) اگر ران در جریان ولی «زامبی» (بیش از ۴۰۰ دقیقه) → لغو و جاب تازه
#   ۳) اگر هیچ رانی نیست → اگر آخرین ران تازه (<۱۵ دقیقه) شکسته بود صبر کن
#      (جلوی لوپ سوختن دقیقه‌ها وقتی مثلاً authkey منقضی شده)، وگرنه جاب تازه بساز
#
# نکته: نود تازه با hostname ثابت «gh-exit» ساخته می‌شود تا اسم نود در تیل‌نت
# همیشه یکی باشد و انتخاب Exit Node روی گوشی معتبر بماند.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ts-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: بررسی نود و صدا زدن ts-exit در صورت نیاز
        env:
          PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          TOK="${PAT:-${{ github.token }}}"
          API="https://api.github.com/repos/$REPO/actions/workflows/ts-exit.yml/runs"
          auth=(-H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json")
          NOW=$(date -u +%s)

          count() {
            curl -s --max-time 20 "${auth[@]}" "$API?status=$1&per_page=10" \
              | tr -d ' ' | grep -o '"total_count":[0-9]*' | head -1 | cut -d: -f2
          }
          RUNNING=$(count in_progress); case "$RUNNING" in ''|*[!0-9]*) RUNNING=0;; esac
          QUEUED=$(count queued);       case "$QUEUED"   in ''|*[!0-9]*) QUEUED=0;;   esac
          echo "in_progress=$RUNNING queued=$QUEUED"

          if [ "$QUEUED" -gt 0 ]; then
            echo "جابی در صف است — صبر می‌کنیم."
            exit 0
          fi

          if [ "$RUNNING" -gt 0 ]; then
            # زامبی‌چک: کهن‌ترین رانِ در جریان چند دقیقه عمر دارد؟
            OLDEST=$(curl -s --max-time 20 "${auth[@]}" "$API?status=in_progress&per_page=5" | python3 -c '
import json,sys,datetime
rs=json.load(sys.stdin).get("workflow_runs",[])
if not rs: print(0); raise SystemExit
t=max(datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")) for r in rs)
print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60))
')
            case "$OLDEST" in ''|*[!0-9]*) OLDEST=0;; esac
            echo "کهن‌ترین ران در جریان: $OLDEST دقیقه"
            if [ "$OLDEST" -le 400 ]; then
              echo "نود زنده است — کاری لازم نیست."
              exit 0
            fi
            echo "ران زامبی (>۴۰۰ دقیقه) — لغو همهٔ ران‌های در جریان…"
            IDS=$(curl -s --max-time 20 "${auth[@]}" "$API?status=in_progress&per_page=10" \
              | grep -o '"id":[0-9]*' | cut -d: -f2)
            for id in $IDS; do
              curl -s -o /dev/null -X POST "${auth[@]}" \
                "https://api.github.com/repos/$REPO/actions/runs/$id/cancel"
              echo "  لغو ران $id"
            done
            sleep 20
          fi

          # محافظ شکست: اگر آخرین رانِ تمام‌شده کمتر از ۱۵ دقیقه پیش شکست خورده
          # بود، دست نزن (مثلاً authkey منقضی است — دوباره نساز که دقیقه نسوزد)
          LAST=$(curl -s --max-time 20 "${auth[@]}" "$API?status=completed&per_page=1")
          echo "$LAST" | python3 -c '
import json,sys,datetime
rs=json.load(sys.stdin).get("workflow_runs",[])
if not rs: raise SystemExit
r=rs[0]
age=int((datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(r["updated_at"].replace("Z","+00:00"))).total_seconds())
print(f"آخرین ران تمام‌شده: {r[\"conclusion\"]} — {age//60} دقیقه پیش")
if r.get("conclusion")=="failure" and age<900:
    print("شکست تازه — این دور دست نمی‌زنیم (محافظ لوپ).")
    raise SystemExit(2)
' || exit 0

          C=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"hostname":"gh-exit"}}' \
            "https://api.github.com/repos/$REPO/actions/workflows/ts-exit.yml/dispatches")
          echo "نود تازه صدا زده شد: HTTP $C"
          [ "$C" = "204" ] || exit 1
