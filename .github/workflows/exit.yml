name: exit
# گره خروج پشتیبان روی GitHub Actions
# ریپو عمومی است ⇒ دقیقه‌های Actions نامحدود و بدون سهمیه، برخلاف کداسپیس.
# وقتی سهمیه کداسپیس تمام شود، ناظر گوشی این ورک‌فلو را صدا می‌زند و
# همین آدرس ثابت (gh.arshadirad7475.workers.dev) به این رانر وصل می‌شود.
# کلاینت هیچ تغییری لازم ندارد چون ورکر میزبان را از host.txt می‌خواند.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "پس از پایان، خودش را دوباره صدا بزند؟ (true/false)"
        required: false
        default: "false"

concurrency:
  group: exit-node
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # سقف یک جاب ۶ ساعت است؛ ۳۵۰ دقیقه حاشیه امن دارد

    steps:
      - name: مکان رانر
        run: |
          curl -s --max-time 15 -o /tmp/geo.txt \
            "http://ip-api.com/line/?fields=query,country,city,as" || true
          echo "رانر: $(paste -sd' | ' /tmp/geo.txt 2>/dev/null)"

      - name: نصب xray و cloudflared
        run: |
          set -e
          cd /tmp
          curl -sL --max-time 180 -o x.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q -o x.zip -d /tmp/xb
          chmod +x /tmp/xb/xray
          /tmp/xb/xray version | head -1

          curl -sL --max-time 180 -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version | head -1

      - name: ساخت کانفیگ بک‌اند
        run: |
          cat > /tmp/xb/be.json <<'JSON'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "listen": "0.0.0.0",
              "port": 8080,
              "protocol": "vless",
              "settings": {
                "clients": [
                  { "id": "50e427ac-5eb5-481b-8717-f4778c4ddf76", "email": "reza" },
                  { "id": "4c6830b6-a129-4a8b-bba6-71692d7c7129", "email": "banoo" }
                ],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": { "path": "/tun" }
              },
              "sniffing": { "enabled": true, "destOverride": ["http", "tls"] }
            }],
            "outbounds": [
              { "protocol": "freedom", "tag": "direct",
                "settings": { "domainStrategy": "UseIPv4" } },
              { "protocol": "blackhole", "tag": "block" }
            ],
            "routing": {
              "rules": [
                { "type": "field", "port": "25,465,587", "outboundTag": "block" }
              ]
            }
          }
          JSON
          python3 -c "import json;json.load(open('/tmp/xb/be.json'));print('کانفیگ معتبر است')"

      - name: راه‌اندازی xray
        run: |
          setsid nohup /tmp/xb/xray run -c /tmp/xb/be.json \
            </dev/null >/tmp/be.log 2>&1 &
          sleep 4
          pgrep -f 'xray run' >/dev/null && echo "xray بالا آمد" || { cat /tmp/be.log; exit 1; }

      - name: بالا آوردن تونل
        run: |
          set +e
          set -u
          : > /tmp/cf.log
          setsid nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8080 \
            --no-autoupdate --edge-ip-version 4 </dev/null >>/tmp/cf.log 2>&1 &

          H=""
          for i in $(seq 1 30); do
            H=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
            [ -n "$H" ] && break
            sleep 2
          done
          [ -n "$H" ] || { echo "میزبان تونل پیدا نشد"; tail -20 /tmp/cf.log; exit 1; }
          H=${H#https://}
          echo "میزبان تونل: $H"
          echo "$H" > /tmp/host

          # منتظر ثبت اتصال تونل بمان (معیار واقعی سلامت تونل)
          for i in $(seq 1 20); do
            grep -qi 'Registered tunnel connection' /tmp/cf.log && break
            sleep 3
          done
          N=$(grep -ci 'Registered tunnel connection' /tmp/cf.log)
          echo "اتصال‌های ثبت‌شده تونل: $N"
          [ "$N" -ge 1 ] || { echo "تونل وصل نشد"; tail -20 /tmp/cf.log; exit 1; }

      - name: سلامت محلی xray
        run: |
          set +e
          C=$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 10 \
              -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
              -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
              -H 'Sec-WebSocket-Version: 13' "http://127.0.0.1:8080/tun")
          echo "سلامت محلی xray: $C  (۱۰۱ = سالم)"
          [ "$C" = "101" ] || { cat /tmp/be.log; exit 1; }

      - name: تشخیص سلامت عمومی (غیرکشنده)
        run: |
          set +e
          H=$(cat /tmp/host)
          echo "--- resolve با DNS سیستم ---"
          getent hosts "$H" || echo "  DNS سیستم resolve نکرد"
          echo "--- resolve با 1.1.1.1 ---"
          curl -s --max-time 12 -o /tmp/dns.json -H 'accept: application/dns-json' \
               "https://1.1.1.1/dns-query?name=$H&type=A"
          IP=$(python3 -c "
          import json
          try:
              d=json.load(open('/tmp/dns.json'))
              print(' '.join(a['data'] for a in d.get('Answer',[]) if a.get('type')==1))
          except Exception: print('')" 2>/dev/null)
          echo "  IP از کلودفلر: ${IP:-هیچ}"
          printf '%s' "$IP" | awk '{print $1}' > /tmp/hostip

          echo "--- آزمون WebSocket عمومی ---"
          C=000
          for i in $(seq 1 10); do
            OUT=$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 12 \
                -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                -H 'Sec-WebSocket-Version: 13' "https://$H/tun" 2>/dev/null)
            [ $? -eq 0 ] && C=$OUT
            [ "$C" = "101" ] && break
            P=$(cat /tmp/hostip 2>/dev/null)
            if [ -n "$P" ]; then
              OUT=$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 12 \
                  --resolve "$H:443:$P" \
                  -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                  -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                  -H 'Sec-WebSocket-Version: 13' "https://$H/tun" 2>/dev/null)
              [ $? -eq 0 ] && C=$OUT
              [ "$C" = "101" ] && { echo "  با --resolve سالم شد"; break; }
            fi
            sleep 5
          done
          echo "سلامت عمومی از دید رانر: $C"
          echo "(اگر ۰۰۰ باشد مشکلی نیست — رانرهای گیت‌هاب به تونل خودشان دسترسی ندارند؛ داوری نهایی با گوشی است)"
          tail -8 /tmp/cf.log

      - name: انتشار میزبان در host.txt
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          set -u
          H=$(cat /tmp/host)
          TOK="${PAT:-${{ github.token }}}"
          B64=$(printf '%s\n' "$H" | base64 -w0)
          curl -s --max-time 40 -o /tmp/cur.json \
            -H "Authorization: Bearer $TOK" \
            "https://api.github.com/repos/${{ github.repository }}/contents/host.txt"
          SHA=$(python3 -c "
          import json
          try: print(json.load(open('/tmp/cur.json')).get('sha',''))
          except Exception: print('')" 2>/dev/null)
          if [ -n "$SHA" ]; then
            BODY="{\"message\":\"actions exit $H\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            BODY="{\"message\":\"actions exit $H\",\"content\":\"$B64\"}"
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/${{ github.repository }}/contents/host.txt")
          echo "انتشار میزبان: HTTP $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || exit 1

      - name: اعلام میزبان به ورکر نسل دو (KV فوری)
        env:
          GH2_KEY: ${{ secrets.GH2_PUB_KEY }}
        run: |
          set +e
          set -u
          H=$(cat /tmp/host)
          if [ -n "${GH2_KEY:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                "https://gh2.arshadirad7475.workers.dev/pub?k=${GH2_KEY}&h=${H}")
            echo "pub به ورکر: HTTP $C"
            # ورکر باید رله را امتحان کند (این تونل لایه ۱ با خروج گیت‌هاب است)
            curl -s -o /dev/null --max-time 20 \
                "https://gh2.arshadirad7475.workers.dev/tier1?k=${GH2_KEY}&v=0"
            echo "tier1 روشن شد (رله به تونل Actions)"
          else
            echo "سکرت GH2_PUB_KEY نیست — ورکر از host.txt می‌خواند (تا ۵ دقیقه تأخیر)"
          fi

      - name: زنده نگه داشتن و نگهبانی
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          set -u
          H=$(cat /tmp/host)
          TOK="${PAT:-${{ github.token }}}"
          FAILS=0
          LOST=0
          END=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            # اولویت با کداسپیس است: اگر host.txt دیگر مال ما نیست، عقب می‌کشیم
            # از API می‌خوانیم نه raw، چون raw حدود ۵ دقیقه کش دارد
            OWN=$(curl -s --max-time 20 \
              -H "Authorization: Bearer $TOK" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/host.txt" \
              2>/dev/null | tr -d '\r\n')
            case "$OWN" in
              *trycloudflare.com)
                if [ "$OWN" != "$H" ]; then
                  LOST=$((LOST+1))
                  echo "host.txt به $OWN تغییر کرده ($LOST/2)"
                  [ "$LOST" -ge 2 ] && { echo "کداسپیس برگشته — این جاب کنار می‌رود"; exit 0; }
                else
                  LOST=0
                fi
                ;;
            esac

            pgrep -f 'xray run' >/dev/null || {
              echo "xray افتاد، دوباره بالا می‌آید"
              setsid nohup /tmp/xb/xray run -c /tmp/xb/be.json </dev/null >>/tmp/be.log 2>&1 &
              sleep 3
            }
            C=000
            OUT=$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 15 \
                -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                -H 'Sec-WebSocket-Version: 13' "http://127.0.0.1:8080/tun" 2>/dev/null)
            [ $? -eq 0 ] && C=$OUT
            if ! pgrep -x cloudflared >/dev/null; then
              echo "cloudflared افتاد — جاب تمام می‌شود تا زنجیره تازه بسازد"
              break
            fi
            if [ "$C" != "101" ]; then
              FAILS=$((FAILS+1))
              echo "$(date -u +%H:%M:%S) سلامت خراب (کد=$C) شماره $FAILS"
              [ "$FAILS" -ge 4 ] && { echo "بک‌اند مرد، جاب تمام می‌شود"; break; }
            else
              FAILS=0
              echo "$(date -u +%H:%M:%S) سالم | میزبان $H"
            fi
            sleep 120
          done

      - name: ادامه زنجیره
        if: ${{ always() && github.event.inputs.chain == 'true' }}
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          if [ -z "${PAT:-}" ]; then
            echo "سکرت GH_PAT نیست، زنجیره ادامه پیدا نمی‌کند"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"chain":"true"}}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/exit.yml/dispatches")
          echo "صدا زدن جاب بعدی: HTTP $CODE"
